version: 2.1

# Orbs: Pre-built CircleCI packages that provide reusable config
# - win: Provides Windows Server 2022 executor for C++ builds
# - path-filtering: Analyzes git diff to conditionally trigger jobs
orbs:
  win: circleci/windows@5.0
  path-filtering: circleci/path-filtering@1.0.0

# setup: true = This is a "setup config" that runs BEFORE the main pipeline
# It only runs the setup-workflow, then hands off to continue-config.yml
setup: true

# Executors: Reusable job environments with specific resources
# resource_class controls CPU/RAM allocation (affects credits usage)
# - small: 1 vCPU, 2GB RAM (cheaper, for light tasks)
# - medium: 2 vCPU, 4GB RAM (default, for heavier tasks)
executors:
  python-small:
    docker:
      - image: cimg/python:3.13 # CircleCI's Python 3.13 image
    resource_class: small
    working_directory: ~/project

  python-medium:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    working_directory: ~/project

# Commands: Reusable step sequences (like functions)
# These are shared between config.yml and continue-config.yml
commands:
  # Install Python deps and verify imports work
  install-python-deps:
    description: "Install Python dependencies and verify imports"
    steps:
      - run:
          name: Install Python dependencies
          command: |
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install ruff  # Linter

      - run:
          name: Verify critical imports
          # Fails fast if core dependencies are broken
          command: |
            python -c "import flask, flask_cors, flask_socketio, sentry_sdk, watchdog, psutil"
            echo "✅ All Python dependencies imported successfully"

  # Set up vcpkg (C++ package manager) with caching for faster builds
  setup-vcpkg-deps:
    description: "Set up vcpkg and install C++ dependencies"
    steps:
      - run:
          name: Clone vcpkg
          # PowerShell: Clone vcpkg repo if not present
          command: |
            if (-not (Test-Path "vcpkg")) {
              git clone https://github.com/microsoft/vcpkg.git
            }

      - run:
          name: Bootstrap vcpkg
          # Compiles vcpkg.exe (one-time setup)
          command: |
            cd vcpkg
            .\bootstrap-vcpkg.bat

      # Cache: Restore previously built packages (saves ~30 min)
      # Key based on vcpkg.json checksum - invalidates when deps change
      - restore_cache:
          keys:
            - vcpkg-packages-v1-{{ checksum "vcpkg.json" }}
            - vcpkg-packages-v1-

      - run:
          name: Install C++ dependencies (manifest mode)
          # Reads vcpkg.json and installs all listed packages
          command: |
            vcpkg/vcpkg.exe install --triplet x64-windows

      # Cache: Save built packages for future builds
      - save_cache:
          key: vcpkg-packages-v1-{{ checksum "vcpkg.json" }}
          paths:
            - vcpkg_installed
            - vcpkg/installed
            - vcpkg/packages
            - C:\Users\circleci\AppData\Local\vcpkg

      - run:
          name: Verify vcpkg dependencies
          command: |
            cd vcpkg
            .\vcpkg.exe list

  # Build the C++ client using CMake + vcpkg
  build-cpp-client:
    description: "Build the C++ encryption client"
    steps:
      - run:
          name: Install CMake
          # Chocolatey: Windows package manager (pre-installed on CircleCI)
          command: |
            choco install cmake --installargs '"ADD_CMAKE_TO_PATH=System"' -y
            refreshenv

      - run:
          name: Configure CMake with vcpkg
          # Links vcpkg packages to CMake build system
          command: |
            $env:PATH = "C:\Program Files\CMake\bin;$env:PATH"
            cmake -B build -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake"

      - run:
          name: Build C++ client
          # --parallel 4: Use 4 CPU cores for faster compilation
          command: |
            $env:PATH = "C:\Program Files\CMake\bin;$env:PATH"
            cmake --build build --config Release --parallel 4

      - run:
          name: Verify build artifacts
          # Fail the build if executable wasn't created
          command: |
            if (Test-Path "build/Release/EncryptedBackupClient.exe") {
              Write-Host "✅ C++ client built successfully"
              Get-ChildItem build/Release/EncryptedBackupClient.exe | Format-List
            } else {
              Write-Host "❌ C++ client build failed"
              exit 1
            }

# NOTE: All job definitions are in continue-config.yml
# This setup config only runs the path-filtering workflow, which then
# triggers continue-config.yml with the appropriate parameters.

# Workflows: Define which jobs run and in what order
workflows:
  version: 2

  # SETUP WORKFLOW: Analyzes git changes and triggers continue-config.yml
  # This is the ONLY workflow that runs from this file (due to setup: true)
  setup-workflow:
    jobs:
      - path-filtering/filter:
          name: check-changed-files
          base-revision: main # Compare against main branch
          config-path: .circleci/continue-config.yml # Config to run after filtering
          # Mapping: regex pattern -> parameter value
          # If ANY file matches pattern, parameter is set to true
          mapping: |
            Client/.* run-cpp-build true
            CMakeLists.txt run-cpp-build true
            vcpkg.json run-cpp-build true
            .*.py run-python-tests true
            python_server/.* run-python-tests true
            api_server/.* run-python-tests true
            Shared/.* run-python-tests true
            FletV2/.* run-python-tests true
            requirements.txt run-python-tests true

  # NOTE: Nightly workflow is in continue-config.yml (scheduled triggers
  # don't work in setup configs)
